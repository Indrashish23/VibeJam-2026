<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Jam — Voice FPS Arena</title>
  </head>
  <body>
    <div id="username-overlay" class="username-overlay">
      <form id="username-form" class="username-card">
        <label for="username-input">Display name</label>
        <input
          id="username-input"
          type="text"
          name="username"
          maxlength="32"
          autocomplete="username"
          placeholder="Angler"
        />
        <button type="submit" id="username-continue">Continue</button>
      </form>
    </div>

    <div id="lobby-overlay" class="lobby-overlay" hidden>
      <div class="lobby-card">
        <h2 class="lobby-title">Play</h2>
        <p id="lobby-intro" class="lobby-intro"></p>
        <button type="button" id="lobby-change-name" class="lobby-link-btn">
          Change display name
        </button>
        <p id="lobby-error" class="lobby-error" role="alert" hidden></p>
        <div class="lobby-actions">
          <button type="button" id="lobby-create" class="lobby-btn">Create lobby</button>
          <button type="button" id="lobby-practice" class="lobby-btn lobby-btn--ghost">
            Practice with Dummy
          </button>
          <label class="lobby-join-row">
            <span>Friend's code</span>
            <input id="lobby-join-code" maxlength="16" autocomplete="off" placeholder="abc123" />
          </label>
          <button type="button" id="lobby-join" class="lobby-btn">Join lobby</button>
          <button type="button" id="lobby-offline" class="lobby-btn lobby-btn--ghost">Play offline</button>
        </div>
      </div>
    </div>

    <div id="game-root" class="game-root" hidden>
      <div id="mp-wait-layer" class="mp-wait-layer" hidden>
        <p id="mp-wait-text" class="mp-wait-text shimmer">Waiting for opponent…</p>
      </div>
      <div id="mp-code-hud" class="mp-code-hud" hidden>
        <span class="mp-code-label">Your code</span>
        <strong id="mp-code-value" class="mp-code-value"></strong>
        <button type="button" id="mp-code-copy" class="mp-code-copy">Copy</button>
        <span class="mp-code-shortcut" aria-hidden="true">C</span>
      </div>
      <div id="mp-toast" class="mp-toast" hidden role="status" aria-live="polite"></div>
      <div id="win-game-splash" class="win-game-splash" hidden>
        <span class="win-game-splash__txt" aria-live="polite">GAME</span>
      </div>
      <div id="dash-scanlines" class="dash-scanlines" aria-hidden="true"></div>
      <div id="hit-flash" class="hit-flash" aria-hidden="true"></div>
      <div id="invuln-shine" class="invuln-shine" hidden aria-hidden="true"></div>
      <div id="rematch-sequence" class="rematch-sequence" hidden>
        <div id="rematch-black-sheet" class="rematch-black-sheet"></div>
      </div>
      <div id="countdown-overlay" class="countdown-overlay" hidden>
        <p id="countdown-title" class="countdown-title" hidden>Match begins in</p>
        <span id="countdown-num" class="countdown-num">3</span>
      </div>
      <div id="percent-hud" class="percent-hud" aria-label="Launch percent">
        <div class="percent-hud__row percent-hud__row--you">
          <span class="percent-hud__label">You</span>
          <span id="percent-you" class="percent-hud__value">0%</span>
        </div>
        <div class="percent-hud__row percent-hud__row--foe">
          <span class="percent-hud__label">Foe</span>
          <span id="percent-foe" class="percent-hud__value">0%</span>
        </div>
      </div>
      <div id="charge-bar-wrap" class="charge-bar-wrap">
        <div id="charge-bar-status" class="charge-bar-label charge-bar-label--prompt">
          Make Sound to Charge
        </div>
        <div class="charge-bar-track">
          <div id="charge-bar-fill" class="charge-bar-fill"></div>
          <span id="charge-bar-min" class="charge-bar-min" title="Minimum to fire"></span>
        </div>
      </div>
      <div id="mic-blocked-overlay" class="mic-blocked-overlay" hidden>
        <div class="mic-blocked-card">
          <p class="mic-blocked-title">Microphone required</p>
          <p id="mic-blocked-sub" class="mic-blocked-sub"></p>
          <p class="mic-blocked-hint">Allow access in your browser to continue.</p>
        </div>
      </div>
      <div id="crosshair" class="crosshair" aria-hidden="true"></div>
      <div id="match-end-overlay" class="match-end-overlay" hidden>
        <div class="match-end-card" role="dialog" aria-labelledby="match-end-title">
          <h2 id="match-end-title" class="match-end-title">You win!</h2>
          <p id="match-end-sub" class="match-end-sub"></p>
          <div id="match-rematch-primary-actions" class="match-end-actions">
            <button type="button" id="match-rematch-btn" class="match-end-btn match-end-btn--primary">
              Rematch
            </button>
            <button type="button" id="match-close-btn" class="match-end-btn">Continue</button>
          </div>
          <p id="match-rematch-status" class="match-rematch-status" hidden></p>
          <button type="button" id="match-rematch-cancel-btn" class="match-end-btn" hidden>
            Cancel request
          </button>
          <div id="match-rematch-incoming" class="match-rematch-incoming" hidden>
            <p class="match-rematch-incoming-label">Your opponent wants a rematch.</p>
            <div class="match-end-actions">
              <button type="button" id="match-rematch-accept-btn" class="match-end-btn match-end-btn--primary">
                Accept
              </button>
              <button type="button" id="match-rematch-decline-btn" class="match-end-btn">Decline</button>
            </div>
          </div>
        </div>
      </div>
      <div id="tweaks-panel-host"></div>
    </div>

    <!-- Outside game-root so logs work on lobby + fixed overlay -->
    <div id="debug-mp-panel" class="debug-mp-panel debug-mp-panel--overlay" hidden>
      <div class="debug-mp-panel__hdr">
        MP debug · <kbd>`</kbd> or <kbd>F2</kbd> hide/show · <kbd>F9</kbd> copy report
      </div>
      <div class="debug-mp-panel__toolbar">
        <button type="button" id="debug-mp-copy" class="debug-mp-copy-btn">Copy full report</button>
      </div>
      <pre id="debug-mp-pre" class="debug-mp-panel__pre"></pre>
    </div>

    <script>
      try {
        var _n = sessionStorage.getItem('vibejam_player_name')
        if (_n && _n.trim()) {
          document.getElementById('username-overlay').hidden = true
          document.getElementById('game-root').hidden = true
        }
      } catch (_) {}
    </script>
    <script async src="https://vibejam.cc/2026/widget.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
